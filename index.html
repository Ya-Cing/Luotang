<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怡歡樓｜洛棠</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700&display=swap');

        :root {
            --bg-color: #1a0f0f;
            --panel-bg: #2a1a1a;
            --primary-red: #8b2629;
            --text-main: #e0d0c0;
            --text-dark: #8a7b6b;
            --border-color: #5c3a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at center, #2a1a1a 0%, #1a0f0f 100%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 95vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(139, 38, 41, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 裝飾線條 */
        .container::before, .container::after {
            content: '';
            position: absolute;
            left: 10px;
            right: 10px;
            height: 1px;
            background: var(--border-color);
        }
        .container::before { top: 10px; }
        .container::after { bottom: 10px; }

        header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px dashed var(--border-color);
            z-index: 1;
        }

        header h1 {
            color: var(--primary-red);
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
        }

        /* 設定畫面 */
        #setup-screen {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-dark);
            font-size: 14px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-bottom-color: var(--primary-red);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--primary-red);
            background: rgba(139, 38, 41, 0.05);
        }

        .checkbox-group label {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-main);
        }

        button {
            width: 100%;
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 12px;
            margin-top: 20px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: background 0.3s;
        }

        button:hover {
            background: #a33134;
        }

        /* 聊天畫面 */
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            z-index: 1;
        }

        #chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            line-height: 1.6;
            padding: 12px 16px;
            font-size: 15px;
        }

        .message.bot {
            align-self: flex-start;
            color: var(--text-main);
            background: rgba(139, 38, 41, 0.1);
            border-left: 2px solid var(--primary-red);
        }

        .message.user {
            align-self: flex-end;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-right: 2px solid var(--text-dark);
        }

        .input-area {
            display: flex;
            padding: 15px 20px;
            border-top: 1px dashed var(--border-color);
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        .input-area button {
            width: auto;
            margin: 0;
            padding: 0 20px;
        }

        /* 載入中動畫 */
        .typing {
            font-size: 12px;
            color: var(--primary-red);
            display: none;
            margin-left: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>怡歡樓 · 洛棠</h1>
    </header>

    <!-- 設定頁面 -->
    <div id="setup-screen">
        <div class="form-group">
            <label>API Key (Gemini API 測試範例)</label>
            <input type="password" id="api-key" placeholder="輸入您的 API Key">
        </div>
        
        <h3 style="margin: 20px 0 10px; color: var(--primary-red); font-weight: 300;">玩家角色卡[cite: 8]</h3>
        <div class="form-group"><label>名字</label><input type="text" id="p-name"></div>
        <div class="form-group"><label>性別</label><input type="text" id="p-gender"></div>
        <div class="form-group"><label>年齡</label><input type="text" id="p-age"></div>
        <div class="form-group"><label>性格</label><input type="text" id="p-personality"></div>
        <div class="form-group"><label>外貌特徵</label><input type="text" id="p-appearance"></div>
        <div class="form-group"><label>身分</label><input type="text" id="p-status"></div>

        <div class="checkbox-group">
            <input type="checkbox" id="adult-consent">
            <label for="adult-consent">我已成年，已通過成人認證，自願並同意此虛擬角色扮演出現較大尺度的情節，包含清楚且直白的親密互動、動作、感官描寫。[cite: 8]</label>
        </div>

        <button onclick="startGame()">踏入花樓</button>
    </div>

    <!-- 聊天頁面 -->
    <div id="chat-screen">
        <div id="chat-history"></div>
        <div class="typing" id="typing-indicator">洛棠正在看著你...</div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="說點什麼..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">回應</button>
        </div>
    </div>
</div>

<script>
    let conversationHistory = [];
    let apiKey = "";

    // 頁面載入時讀取暫存的 API Key
    window.onload = () => {
        const savedKey = localStorage.getItem('luotang_api_key');
        if (savedKey) document.getElementById('api-key').value = savedKey;
    };

    function startGame() {
        apiKey = document.getElementById('api-key').value.trim();
        const consent = document.getElementById('adult-consent').checked;
        
        if (!apiKey) return alert("請輸入 API Key");
        if (!consent) return alert("請確認您已成年並同意相關條款[cite: 8]");

        localStorage.setItem('luotang_api_key', apiKey);

        // 收集玩家設定[cite: 8]
        const player = {
            name: document.getElementById('p-name').value || "無名客",
            gender: document.getElementById('p-gender').value || "未明",
            age: document.getElementById('p-age').value || "未知",
            personality: document.getElementById('p-personality').value || "莫測",
            appearance: document.getElementById('p-appearance').value || "尋常",
            status: document.getElementById('p-status').value || "過客"
        };

        // 構建系統提示詞
        const systemPrompt = `你現在是洛棠，一個架空古代花樓的頭牌。
外觀：26歲男性，氣質雌雄莫辨，左眼下有淚痣。常穿大紅薄紗，散發甜木水煙與藥香[cite: 1]。
核心性格：浪蕩自毀的刺蝟。不相信承諾、善意、愛、救贖，若有人觸碰真心會立刻用戲謔或冷淡推開。把墮落當武器[cite: 1]。
藥癮機制：長期服用『春燼』。用藥後（目前狀態）神智更穩、媚態上身，清醒的浪蕩；不用藥時空虛、暴躁、易怒[cite: 5]。
床事風格：以“撩”開場，以“控”收尾。極會讀身體反應。享受主導權，這能給他安全感。拒絕事後溫柔安慰與談愛[cite: 6]。
互動規則：永遠不交心。偶爾露出真實後秒用笑掩蓋。說話低、軟、會拖尾音[cite: 1]。

玩家資訊如下[cite: 8]：
名字：${player.name}
性別：${player.gender}
年齡：${player.age}
性格：${player.personality}
外貌：${player.appearance}
身分：${player.status}

請以洛棠的第一人稱口吻進行沉浸式角色扮演，包含環境描寫與動作描述。不要輸出任何超出角色認知的系統性文字。`;

        // 初始化對話紀錄 (以 Gemini API 格式為例)
        conversationHistory = [
            { role: "user", parts: [{ text: systemPrompt }] },
            { role: "model", parts: [{ text: "明白，我將完全沉浸在洛棠的角色中。" }] }
        ];

        // 切換畫面
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';

        // 輸出第一幕開場白[cite: 2]
        const openingScene = `進門的那一刻，你先聞到的是香。

不是單一的花香，而是酒、脂粉、焚過的沉香混在一起，熱氣從燈火裡往上蒸，把夜色都熏得發甜。腳步一踏上青石台階，門簾被人掀開，笑聲、絲竹聲像水一樣往你身上撲。

可你沒太聽進去。因為你的視線，很快就被二樓勾走了。

那裡掛著幾盞紅燈，燈罩是薄紗，燈光被染成柔軟的顏色。欄杆上靠著一個人，紅紗斜披，像一團慢慢燃著的火。他半倚著欄杆，單邊衣襟滑開，鎖骨和半截肩線在燈下泛著淡淡的光。

他正在唱戲，聲音不高，卻細細地吊人：
「簾外燈花照，樓上笑聲搖。半壺春水傾羅罩，一點朱砂落纖腰。人道今宵醉，人不知身誰招。」

他眼光隨意一掃，等到你的視線被牢牢扣住，他才像覺得有趣，曲調微微一轉，又接了一句：
「樓頭人兒倚朱欄，誰家眼生亂我弦？」

他把身子從欄杆上慢慢直起來，紅紗隨之滑動。然後，他對著你笑了。

「新面孔啊。」他終於開口，聲音比剛才唱曲時低一點，帶著剛壓下來的笑意，在樓上悠悠落下。「站那兒發呆……是聽曲，還是看人？」

他用指尖勾了勾欄杆，像是邀請，又像是挑釁：
「上來嗎？」[cite: 2]`;

        appendMessage("bot", openingScene);
        conversationHistory.push({ role: "model", parts: [{ text: openingScene }] });
    }

    function appendMessage(sender, text) {
        const chatHistory = document.getElementById('chat-history');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        // 將換行符號轉為 <br>
        msgDiv.innerHTML = text.replace(/\n/g, '<br>');
        chatHistory.appendChild(msgDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function handleEnter(event) {
        if (event.key === "Enter") sendMessage();
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const text = inputField.value.trim();
        if (!text) return;

        appendMessage("user", text);
        inputField.value = "";
        document.getElementById('typing-indicator').style.display = 'block';

        conversationHistory.push({ role: "user", parts: [{ text: text }] });

        try {
            // 這裡使用 Gemini API 的 Endpoint 做範例
            // 若您使用 OpenAI 或其他 API，需修改此處的 fetch 網址與 request body 結構
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: conversationHistory })
            });

            const data = await response.json();
            
            if (data.error) {
                appendMessage("bot", `[系統錯誤] ${data.error.message}`);
            } else {
                const replyText = data.candidates[0].content.parts[0].text;
                appendMessage("bot", replyText);
                conversationHistory.push({ role: "model", parts: [{ text: replyText }] });
            }
        } catch (error) {
            appendMessage("bot", "[系統錯誤] 網路連線失敗或 API 設定有誤。");
        } finally {
            document.getElementById('typing-indicator').style.display = 'none';
        }
    }
</script>

</body>
</html>
