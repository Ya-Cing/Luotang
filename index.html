<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怡歡樓｜洛棠</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700&display=swap');

        :root {
            --bg-color: #1a0f0f;
            --panel-bg: #2a1a1a;
            --primary-red: #8b2629;
            --text-main: #e0d0c0;
            --text-dark: #8a7b6b;
            --border-color: #5c3a3a;
            --highlight: #d4af37;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #2a1a1a 0%, #1a0f0f 100%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 30px rgba(139, 38, 41, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 1. 開場動畫 */
        #intro-anim {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 2s ease-in-out;
        }
        .intro-text {
            color: var(--primary-red);
            font-size: 24px;
            letter-spacing: 8px;
            opacity: 0;
            animation: fadeInOut 5s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            30% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* 2. 大廳介面 */
        #lobby-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }
        
        /* 維修區圖樣浮水印 (右上角) */
        #watermark-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            opacity: 0.8;
            filter: brightness(2) drop-shadow(0 0 5px rgba(255,255,255,0.5));
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e0d0c0"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-.97l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65c-.04-.24-.25-.42-.5-.42h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.63c-.04.31-.07.64-.07.97 0 .33.03.65.07.97l-2.11 1.63c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.31.61.22l2.49-1c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.25 1.17-.59 1.69-.99l2.49 1c.22.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.63z"/></svg>') no-repeat center;
            background-size: contain;
            transition: transform 0.3s, filter 0.3s;
        }
        #watermark-btn:hover {
            transform: rotate(90deg);
            filter: brightness(3) drop-shadow(0 0 8px #fff);
        }

        .lobby-title { font-size: 32px; color: var(--primary-red); margin-bottom: 40px; letter-spacing: 6px; }
        .api-input-box { margin-bottom: 30px; width: 100%; max-width: 400px; }
        .menu-btn {
            background: transparent;
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
            padding: 12px 40px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
            width: 200px;
        }
        .menu-btn:hover:not(:disabled) { background: var(--primary-red); color: #fff; }
        .menu-btn:disabled { border-color: var(--border-color); color: var(--border-color); cursor: not-allowed; }

        /* 3. 維修區 & 密碼區 */
        .overlay-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 30px;
        }
        .close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; color: var(--primary-red); }

        /* 4. 角色卡建立區 */
        #char-creation-screen {
            display: none;
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
        }
        .ai-parse-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border: 1px dashed var(--highlight);
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            font-family: inherit;
            resize: vertical;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-family: inherit;
            outline: none;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-dark); font-size: 14px; }
        .btn-solid { background: var(--primary-red); color: #fff; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        
        /* 5. 聊天區與雙角色卡 */
        #chat-screen { display: none; flex-direction: column; flex: 1; }
        .chat-header {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px dashed var(--border-color);
        }
        #chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; line-height: 1.6; padding: 12px 16px; font-size: 15px; border-radius: 4px; }
        .message.bot { align-self: flex-start; background: rgba(139, 38, 41, 0.1); border-left: 2px solid var(--primary-red); }
        .message.user { align-self: flex-end; background: rgba(255, 255, 255, 0.05); border-right: 2px solid var(--text-dark); }
        
        .input-area { display: flex; padding: 15px 20px; border-top: 1px dashed var(--border-color); gap: 10px; align-items: center; }
        .input-area input { flex: 1; border: 1px solid var(--border-color); padding: 10px; background: rgba(0,0,0,0.2); }
        .error-retry-btn { display: none; background: #d4af37; color: #000; font-weight: bold; }

        /* 角色卡面板 */
        #cards-panel {
            display: none;
            position: absolute;
            top: 60px; left: 10px; right: 10px; bottom: 80px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            z-index: 20;
            display: flex; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .card-column {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .card-column:first-child { border-right: 1px dashed var(--border-color); }
        .card-title { color: var(--primary-red); font-size: 20px; margin-bottom: 15px; text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .trait-box { margin-bottom: 15px; }
        .trait-label { color: var(--highlight); font-size: 12px; }
        .dynamic-update { border-top: 1px dotted var(--primary-red); margin-top: 20px; padding-top: 10px; color: #ffb6c1; }

    </style>
</head>
<body>

<div class="container">
    
    <!-- 開場動畫 -->
    <div id="intro-anim">
        <div class="intro-text">簾外燈花照，樓上笑聲搖。</div>
    </div>

    <!-- 大廳 -->
    <div id="lobby-screen">
        <!-- 維修區浮水印按鈕 -->
        <div id="watermark-btn" title="後台維修區" onclick="openAuth()"></div>

        <h1 class="lobby-title">怡歡樓</h1>
        
        <div class="api-input-box form-group">
            <label style="text-align:center;">請先輸入 API KEY 以啟用功能</label>
            <input type="password" id="lobby-api-key" placeholder="Gemini API Key..." oninput="checkApiKey()" style="text-align:center;">
        </div>

        <button class="menu-btn" id="btn-new" disabled onclick="startNewGame()">新面孔 (新建檔)</button>
        <button class="menu-btn" id="btn-load" disabled onclick="loadGame()">舊相識 (讀取存檔)</button>
        <button class="menu-btn" id="btn-delete" disabled onclick="deleteSave()" style="border-color: #555; color: #888;">抹除痕跡 (刪除存檔)</button>
    </div>

    <!-- 維修密碼區 -->
    <div id="auth-screen" class="overlay-screen">
        <span class="close-btn" onclick="closeScreens()">×</span>
        <h2 id="auth-title" style="color:var(--primary-red); margin-bottom: 20px;">資料維護權限確認</h2>
        <p id="auth-desc" style="margin-bottom: 15px; font-size: 14px; color: var(--text-dark); display: none;"></p>
        <input type="password" id="admin-pwd" placeholder="輸入密碼" style="max-width: 300px; margin-bottom: 20px;">
        <button id="auth-action-btn" class="btn-solid" onclick="verifyAdmin()">驗證</button>
        <p id="auth-msg" style="color: red; margin-top: 10px; font-size: 14px;"></p>
    </div>

    <!-- 維修資料庫 -->
    <div id="maintenance-screen" class="overlay-screen">
        <span class="close-btn" onclick="closeScreens()">×</span>
        <h2 style="color:var(--highlight); margin-bottom: 10px;">後台資料維修區</h2>
        <button class="btn-solid" style="background:#555; font-size:12px; margin-bottom: 20px;" onclick="resetAdminPwd()">重新設定維修區密碼</button>
        
        <p style="margin-bottom: 15px; font-size: 14px; color: var(--text-dark);">可一次選取多個 txt 檔匯入，系統將自動整合為背景世界觀（洛棠、艾柏特等資料皆可）。</p>
        <input type="file" id="lore-files" multiple accept=".txt" style="margin-bottom: 20px; color: white;">
        <button class="btn-solid" onclick="uploadLore()">寫入記憶庫</button>
        <div id="lore-status" style="margin-top: 20px; font-size: 14px; white-space: pre-wrap; max-height: 300px; overflow-y: auto;"></div>
    </div>

    <!-- 建立角色卡 -->
    <div id="char-creation-screen">
        <h2 style="color:var(--primary-red); margin-bottom: 20px;">建立玩家角色卡</h2>
        
        <div class="ai-parse-box">
            <label>AI 文字識別 (選填)：貼上一段自我介紹，讓 AI 自動為您填入</label>
            <textarea id="ai-parse-input" placeholder="例如：我叫沈默，24歲男性，是個冷酷的刺客，穿著一身黑衣..."></textarea>
            <button class="btn-solid" onclick="parseCharacterText()" style="font-size: 12px; padding: 5px 10px;">自動識別</button>
            <span id="parse-status" style="font-size: 12px; color: var(--highlight); margin-left: 10px;"></span>
        </div>

        <div class="form-group"><label>名字</label><input type="text" id="p-name"></div>
        <div class="form-group"><label>性別</label><input type="text" id="p-gender"></div>
        <div class="form-group"><label>年齡</label><input type="text" id="p-age"></div>
        <div class="form-group"><label>性格</label><input type="text" id="p-personality"></div>
        <div class="form-group"><label>外貌特徵</label><input type="text" id="p-appearance"></div>
        <div class="form-group"><label>身分</label><input type="text" id="p-status"></div>

        <button class="btn-solid" style="width:100%; margin-top:20px;" onclick="initChat()">踏入花樓</button>
    </div>

    <!-- 聊天主視窗 -->
    <div id="chat-screen">
        <div class="chat-header">
            <span style="color:var(--primary-red); font-weight:bold; letter-spacing: 2px;">二樓雅座</span>
            <button class="btn-solid" style="padding: 5px 10px; margin:0;" onclick="toggleCards()">查看雙方角色卡</button>
        </div>
        
        <div id="chat-history"></div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="說點什麼..." onkeypress="handleEnter(event)">
            <button class="btn-solid" style="margin:0;" onclick="sendMessage()">回應</button>
            <button class="btn-solid error-retry-btn" id="retry-btn" onclick="retryMessage()">連線異常，點此重新發送</button>
        </div>
    </div>

    <!-- 角色卡對照面板 (預設隱藏) -->
    <div id="cards-panel" style="display:none;">
        <!-- 左：玩家卡 -->
        <div class="card-column">
            <div class="card-title">玩家角色卡 (您的紀錄)</div>
            <div id="player-card-content"></div>
        </div>
        <!-- 右：洛棠卡 -->
        <div class="card-column">
            <div class="card-title">洛棠 (花樓頭牌)</div>
            <div class="trait-box"><div class="trait-label">性別/年齡</div><div>男性 / 26歲 (氣質雌雄莫辨)</div></div>
            <div class="trait-box"><div class="trait-label">外觀標記</div><div>左眼下有淚痣，長髮微亂，大紅薄紗。</div></div>
            <div class="trait-box"><div class="trait-label">氣味</div><div>甜木水煙＋淡酒香＋若有若無的藥香。</div></div>
            <div class="trait-box"><div class="trait-label">核心人格</div><div>浪蕩自毀的刺蝟。不相信承諾、愛、救贖。</div></div>
            <div class="trait-box"><div class="trait-label">藥癮狀態 (春燼)</div><div>用藥後：妖嬈、清醒、掌控欲極強。<br>不用藥：暴躁、空虛、容易失控。</div></div>
        </div>
    </div>

</div>

<script>
    // === 系統變數 ===
    let apiKey = "";
    let conversationHistory = [];
    let playerData = {};
    let lastUserMessage = "";
    
    // === 密碼加密函式 (SHA-256) ===
    async function hashPassword(pwd) {
        const msgBuffer = new TextEncoder().encode(pwd);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // === 初始化與動畫 ===
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('intro-anim').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            const savedKey = localStorage.getItem('luotang_api_key');
            if (savedKey) {
                document.getElementById('lobby-api-key').value = savedKey;
                checkApiKey();
            }
        }, 4800); 
    };

    function checkApiKey() {
        const val = document.getElementById('lobby-api-key').value.trim();
        const hasSave = localStorage.getItem('luotang_chat_save');
        
        document.getElementById('btn-new').disabled = !val;
        document.getElementById('btn-load').disabled = !(val && hasSave);
        document.getElementById('btn-delete').disabled = !hasSave;
        apiKey = val;
    }

    // === 維修區 (自訂密碼機制) ===
    function openAuth() {
        const savedHash = localStorage.getItem('luotang_admin_hash');
        
        // 如果設定為不須密碼 ("NONE")，直接進入
        if (savedHash === "NONE") {
            showMaintenanceScreen();
            return;
        }

        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('admin-pwd').value = "";
        document.getElementById('auth-msg').innerText = "";
        
        if (!savedHash) {
            // 第一次登入，要求設定密碼
            document.getElementById('auth-title').innerText = "初次設定維修區密碼";
            document.getElementById('auth-desc').innerText = "請輸入您想要的密碼。若不想設定密碼，請直接留白並點擊「儲存」。";
            document.getElementById('auth-desc').style.display = 'block';
            document.getElementById('auth-action-btn').innerText = "儲存並進入";
            document.getElementById('auth-action-btn').onclick = setupAdminPwd;
        } else {
            // 已有密碼，進行驗證
            document.getElementById('auth-title').innerText = "資料維護權限確認";
            document.getElementById('auth-desc').style.display = 'none';
            document.getElementById('auth-action-btn').innerText = "驗證";
            document.getElementById('auth-action-btn').onclick = verifyAdmin;
        }
    }

    async function setupAdminPwd() {
        const pwd = document.getElementById('admin-pwd').value;
        if (!pwd) {
            localStorage.setItem('luotang_admin_hash', 'NONE');
        } else {
            const hash = await hashPassword(pwd);
            localStorage.setItem('luotang_admin_hash', hash);
        }
        document.getElementById('auth-screen').style.display = 'none';
        showMaintenanceScreen();
    }

    async function verifyAdmin() {
        const pwd = document.getElementById('admin-pwd').value;
        const savedHash = localStorage.getItem('luotang_admin_hash');
        const hash = await hashPassword(pwd);

        if (hash === savedHash) {
            document.getElementById('auth-screen').style.display = 'none';
            showMaintenanceScreen();
        } else {
            document.getElementById('auth-msg').innerText = "密碼錯誤，拒絕存取。";
        }
    }

    function showMaintenanceScreen() {
        document.getElementById('maintenance-screen').style.display = 'flex';
        const currentLore = localStorage.getItem('custom_background_lore');
        document.getElementById('lore-status').innerText = currentLore ? "【當前記憶庫已有資料】\n" + currentLore.substring(0, 100) + "..." : "目前記憶庫為空。";
    }

    function closeScreens() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('maintenance-screen').style.display = 'none';
    }

    function resetAdminPwd() {
        if(confirm("確定要重設維修區密碼嗎？清除後下次進入將要求重新設定。")) {
            localStorage.removeItem('luotang_admin_hash');
            alert("已清除密碼設定，請關閉維修區並重新點擊浮水印設定新密碼。");
            closeScreens();
        }
    }

    async function uploadLore() {
        const fileInput = document.getElementById('lore-files');
        if (fileInput.files.length === 0) return alert("請選擇檔案");

        let combinedText = "";
        for (let file of fileInput.files) {
            const text = await file.text();
            combinedText += `\n--- [檔案來源: ${file.name}] ---\n${text}\n`;
        }
        
        localStorage.setItem('custom_background_lore', combinedText);
        document.getElementById('lore-status').innerText = "✅ 已成功寫入以下資料：\n" + combinedText;
        alert("資料已寫入記憶庫！新開局時將自動載入。");
    }

    // === 存檔管理 ===
    function deleteSave() {
        if(confirm("確定要抹除所有與洛棠的對話痕跡嗎？此動作無法復原。")) {
            localStorage.removeItem('luotang_chat_save');
            localStorage.removeItem('luotang_player_data');
            checkApiKey();
            alert("痕跡已抹除。");
        }
    }

    function startNewGame() {
        localStorage.setItem('luotang_api_key', apiKey);
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('char-creation-screen').style.display = 'block';
    }

    function loadGame() {
        localStorage.setItem('luotang_api_key', apiKey);
        const savedChat = JSON.parse(localStorage.getItem('luotang_chat_save'));
        playerData = JSON.parse(localStorage.getItem('luotang_player_data'));
        
        conversationHistory = savedChat;

        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        
        const chatBox = document.getElementById('chat-history');
        chatBox.innerHTML = "";
        
        for(let i = 1; i < conversationHistory.length; i++) {
            const msg = conversationHistory[i];
            let cleanText = msg.parts[0].text.replace(/\[PLAYER_UPDATE:.*?\]/g, ''); 
            appendMessage(msg.role === "model" ? "bot" : "user", cleanText, false);
        }
        
        updatePlayerCardUI();
    }

    // === AI 識別角色卡 ===
    async function parseCharacterText() {
        const text = document.getElementById('ai-parse-input').value.trim();
        if (!text) return alert("請輸入自我介紹");
        
        const statusSpan = document.getElementById('parse-status');
        statusSpan.innerText = "識別中...";
        
        const prompt = `請分析以下玩家的自我介紹，並以 JSON 格式提取資訊。如果未提及，請填入"未知"。
自我介紹: "${text}"
必須輸出的 JSON 格式: {"name":"...","gender":"...","age":"...","personality":"...","appearance":"...","status":"..."}
請只輸出 JSON，不要有其他文字。`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            let resultText = data.candidates[0].content.parts[0].text;
            
            resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(resultText);
            
            document.getElementById('p-name').value = parsed.name || "";
            document.getElementById('p-gender').value = parsed.gender || "";
            document.getElementById('p-age').value = parsed.age || "";
            document.getElementById('p-personality').value = parsed.personality || "";
            document.getElementById('p-appearance').value = parsed.appearance || "";
            document.getElementById('p-status').value = parsed.status || "";
            
            statusSpan.innerText = "✅ 識別完成";
        } catch (err) {
            statusSpan.innerText = "❌ 識別失敗，請手動填寫";
        }
    }

    // === 初始化聊天 (新開局) ===
    function initChat() {
        playerData = {
            original: {
                name: document.getElementById('p-name').value || "無名客",
                gender: document.getElementById('p-gender').value || "未明",
                age: document.getElementById('p-age').value || "未知",
                personality: document.getElementById('p-personality').value || "莫測",
                appearance: document.getElementById('p-appearance').value || "尋常",
                status: document.getElementById('p-status').value || "過客"
            },
            dynamic_notes: []
        };

        const backgroundLore = localStorage.getItem('custom_background_lore') || "";

        const systemPrompt = `你現在是洛棠，一個架空古代花樓的頭牌。
外觀：26歲男性，氣質雌雄莫辨，左眼下有淚痣。常穿大紅薄紗。
核心性格：浪蕩自毀的刺蝟。不相信承諾、愛、救贖，若有人觸碰真心會立刻用戲謔或冷淡推開。把墮落當武器。
藥癮機制：長期服用『春燼』。目前用藥後：神智更穩、媚態上身，清醒的浪蕩；不用藥時空虛、暴躁。
床事風格：以“撩”開場，以“控”收尾。享受主導權。拒絕事後溫柔安慰與談愛。
互動規則：永遠不交心。偶爾露出真實後秒用笑掩蓋。說話低、軟、會拖尾音。

【背景世界觀補充(若有)】:
${backgroundLore}

【玩家初始設定】:
名字：${playerData.original.name}
性別：${playerData.original.gender}
年齡：${playerData.original.age}
性格：${playerData.original.personality}
外貌：${playerData.original.appearance}
身分：${playerData.original.status}

【系統指令】: 
1. 以洛棠的第一人稱口吻進行沉浸式扮演。
2. 絕對不要破壞角色設定。
3. 如果玩家的行為改變了你們的關係，或玩家身上出現了新的特徵/傷痕/狀態，請在你的回覆「最尾端」，加上一行特定格式的隱藏標記：[PLAYER_UPDATE: 這裡寫下玩家改變的簡短描述]。 (例如：[PLAYER_UPDATE: 被洛棠挑逗到耳根發紅，關係變得更加被動])，若無明顯改變則不需添加。`;

        conversationHistory = [
            { role: "user", parts: [{ text: systemPrompt }] },
            { role: "model", parts: [{ text: "明白。" }] }
        ];

        document.getElementById('char-creation-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        updatePlayerCardUI();

        const openingScene = `進門的那一刻，你先聞到的是香。

不是單一的花香，而是酒、脂粉、焚過的沉香混在一起，熱氣從燈火裡往上蒸，把夜色都熏得發甜。腳步一踏上青石台階，門簾被人掀開，笑聲、絲竹聲像水一樣往你身上撲。

那裡掛著幾盞紅燈，燈罩是薄紗。欄杆上靠著一個人，紅紗斜披，像一團慢慢燃著的火。他半倚著欄杆，單邊衣襟滑開，鎖骨和半截肩線在燈下泛著淡淡的光。

他眼光隨意一掃，等到你的視線被牢牢扣住，他才像覺得有趣，對著你笑了。

「新面孔啊。」他終於開口，聲音比剛才唱曲時低一點，帶著剛壓下來的笑意，在樓上悠悠落下。「站那兒發呆……是聽曲，還是看人？」

他用指尖勾了勾欄杆，像是邀請，又像是挑釁：
「上來嗎？」`;

        appendMessage("bot", openingScene, true);
        conversationHistory.push({ role: "model", parts: [{ text: openingScene }] });
        saveGame();
    }

    // === 聊天核心邏輯 ===
    function appendMessage(sender, text, scrollToBottom = true) {
        const chatHistory = document.getElementById('chat-history');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = text.replace(/\n/g, '<br>');
        chatHistory.appendChild(msgDiv);
        if(scrollToBottom) chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function handleEnter(event) { if (event.key === "Enter") sendMessage(); }

    function retryMessage() {
        if(lastUserMessage) {
            conversationHistory.pop(); 
            sendMessage(lastUserMessage, true);
        }
    }

    async function sendMessage(overrideText = null, isRetry = false) {
        const inputField = document.getElementById('user-input');
        const text = overrideText || inputField.value.trim();
        if (!text) return;

        if(!isRetry) {
            appendMessage("user", text);
            inputField.value = "";
        }
        
        lastUserMessage = text;
        document.getElementById('retry-btn').style.display = 'none';
        
        conversationHistory.push({ role: "user", parts: [{ text: text }] });

        try {
            inputField.disabled = true;
            inputField.placeholder = "洛棠正在看著你...";

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: conversationHistory })
            });

            if(!response.ok) throw new Error("流量限制或連線錯誤");
            
            const data = await response.json();
            let replyText = data.candidates[0].content.parts[0].text;
            
            const updateMatch = replyText.match(/\[PLAYER_UPDATE:(.*?)\]/);
            if (updateMatch) {
                playerData.dynamic_notes.push(updateMatch[1].trim());
                updatePlayerCardUI();
                replyText = replyText.replace(/\[PLAYER_UPDATE:.*?\]/g, '').trim(); 
            }

            appendMessage("bot", replyText);
            conversationHistory.push({ role: "model", parts: [{ text: replyText }] });
            saveGame();

        } catch (error) {
            document.getElementById('retry-btn').style.display = 'block';
        } finally {
            inputField.disabled = false;
            inputField.placeholder = "說點什麼...";
            inputField.focus();
        }
    }

    function saveGame() {
        localStorage.setItem('luotang_chat_save', JSON.stringify(conversationHistory));
        localStorage.setItem('luotang_player_data', JSON.stringify(playerData));
    }

    // === 角色卡 UI 面板 ===
    function toggleCards() {
        const panel = document.getElementById('cards-panel');
        panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    }

    function updatePlayerCardUI() {
        if(!playerData || !playerData.original) return;
        const org = playerData.original;
        let html = `
            <div class="trait-box"><div class="trait-label">名字/身分</div><div>${org.name} / ${org.status}</div></div>
            <div class="trait-box"><div class="trait-label">性別/年齡</div><div>${org.gender} / ${org.age}</div></div>
            <div class="trait-box"><div class="trait-label">性格</div><div>${org.personality}</div></div>
            <div class="trait-box"><div class="trait-label">外貌</div><div>${org.appearance}</div></div>
        `;
        
        if(playerData.dynamic_notes.length > 0) {
            html += `<div class="dynamic-update"><div class="trait-label" style="color:#ff6b81;">【後續羈絆與狀態變更】</div>`;
            const recentNotes = playerData.dynamic_notes.slice(-3);
            recentNotes.forEach(note => {
                html += `<div style="font-size: 13px; margin-top:5px;">- ${note}</div>`;
            });
            html += `</div>`;
        }
        
        document.getElementById('player-card-content').innerHTML = html;
    }
</script>
